version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A brand-new release is the likeliest to be malicious or broken,
    # so let it sit for a week before we're offered it
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
    cooldown:
      default-days: 7